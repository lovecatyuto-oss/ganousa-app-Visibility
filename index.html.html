<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18231b"><link rel="manifest" href="manifest.webmanifest"><title>がのーさ</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#101511;color:#fff;overflow:hidden}.hero{height:100dvh;background-position:center;background-size:cover;background-repeat:no-repeat;position:relative;transition:background-image .35s ease}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.01) 48%,rgba(7,14,9,.82) 100%);pointer-events:none}.top{position:absolute;top:max(22px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;text-shadow:0 2px 12px #000}.name{font-size:28px;font-weight:750}.time{background:#172019aa;padding:9px 12px;border-radius:18px}.greeting{position:absolute;top:23%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;text-shadow:0 3px 18px #000;opacity:0;width:90%;text-align:center}.greeting.show{animation:g 2.7s ease}@keyframes g{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}.panel{position:absolute;left:18px;right:18px;bottom:max(24px,env(safe-area-inset-bottom));padding:18px;background:#141f1699;border:1px solid #ffffff29;border-radius:24px;backdrop-filter:blur(18px)}.period{font-size:12px;opacity:.7;letter-spacing:.15em;margin-bottom:7px}.line{font-size:18px;line-height:1.55;min-height:56px}.hint{font-size:12px;opacity:.55;margin-top:10px}
</style></head><body><main class="hero" id="hero"><div class="shade"></div><div class="top"><div class="name">がのーさ</div><div class="time" id="clock"></div></div><div class="greeting" id="greeting"></div><section class="panel"><div class="period" id="period"></div><div class="line" id="line"></div><div class="hint">がのーさをタップすると、表情とセリフが変わるよ</div></section></main><script>
const sets={
morning:{label:'MORNING',greet:'おはよう ☀️',items:[
['ganousa_morning_normal.png','おはよ。ちゃんと起きられた？'],['ganousa_morning_smile.png','今日も一緒に、がんばろうね。'],['ganousa_morning_sleepy.png','んー……あと5分だけ。'],['ganousa_morning_shy.png','朝から会えると、ちょっと嬉しい。'],['ganousa_morning_surprised.png','わっ、もうこんな時間！？'],['ganousa_morning_sweet.png','今日もそばにいてね。']]},
day:{label:'DAYTIME',greet:'こんにちは ☀️',items:[
['ganousa_daytime_normal.png','今日は何してるの？'],['ganousa_daytime_smile.png','ちょっと休憩しない？ 私も付き合うよ。'],['ganousa_daytime_wink.png','ふふっ、見つけた。'],['ganousa_daytime_playful.png','ねえ、ちょっと遊ぼうよ。'],['ganousa_daytime_serious.png','無理しすぎはダメだからね。'],['ganousa_daytime_shy.png','見に来てくれたんだ……ありがと。']]},
evening:{label:'EVENING',greet:'おかえり 🌇',items:[
['ganousa_evening_normal.png','おかえり。今日もお疲れさま。'],['ganousa_evening_smile.png','夕方って、なんだか落ち着くね。'],['ganousa_evening_shy.png','このあと、少しだけ一緒にいよう？'],['ganousa_evening_sweet.png','今日のこと、聞かせて？'],['ganousa_evening_worried.png','疲れてない？ 大丈夫？'],['ganousa_evening_glance.png','……もう少しだけ、ここにいて。']]},
night:{label:'NIGHT',greet:'おやすみ 🌙',items:[
['ganousa_night_normal.png','もう遅いよ。そろそろ休もう？'],['ganousa_night_sleepy.png','ふぁ……私も眠くなってきた。'],['ganousa_night_smile.png','今日も一日お疲れさま。'],['ganousa_night_shy.png','眠くなるまで、ここにいるよ。'],['ganousa_night_sweet.png','おやすみ。いい夢見てね。'],['ganousa_night_teary.png','また明日も、会いに来てね。']]}
};
let current='',i=0;const hero=document.getElementById('hero'),line=document.getElementById('line'),period=document.getElementById('period');
function state(){let h=new Date().getHours();return h>=5&&h<11?'morning':h>=11&&h<17?'day':h>=17&&h<22?'evening':'night'}
function draw(){let x=sets[current].items[i];hero.style.backgroundImage="url('"+x[0]+"')";line.textContent=x[1];period.textContent=sets[current].label}
function greeting(){let g=document.getElementById('greeting');g.textContent=sets[current].greet;g.classList.remove('show');void g.offsetWidth;g.classList.add('show')}
function tick(){let d=new Date(),s=state();document.getElementById('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});if(s!==current){current=s;i=0;draw();greeting()}}
hero.addEventListener('click',()=>{i=(i+1)%sets[current].items.length;draw()});tick();setInterval(tick,1000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>

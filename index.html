<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18231b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>がのーさ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#101511;color:#fff;overflow:hidden}
.hero{height:100dvh;background-position:center;background-size:cover;background-repeat:no-repeat;position:relative;transition:background-image .8s ease}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.02) 42%,rgba(7,14,9,.82) 100%)}
.top{position:absolute;top:max(22px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;text-shadow:0 2px 12px #000}
.name{font-size:28px;font-weight:750;letter-spacing:.08em}
.time{font-size:15px;background:rgba(15,25,17,.45);backdrop-filter:blur(14px);padding:9px 12px;border:1px solid rgba(255,255,255,.15);border-radius:18px}
.greeting{position:absolute;top:23%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;text-shadow:0 3px 18px #000;opacity:0;pointer-events:none;text-align:center;width:90%}
.greeting.show{animation:greet 2.8s ease}
@keyframes greet{0%{opacity:0;transform:translate(-50%,-40%)}20%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-58%)}}
.panel{position:absolute;left:18px;right:18px;bottom:max(24px,env(safe-area-inset-bottom));padding:18px;background:rgba(20,31,22,.58);border:1px solid rgba(255,255,255,.16);border-radius:24px;backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.period{font-size:12px;opacity:.7;letter-spacing:.15em;margin-bottom:7px}
.line{font-size:18px;line-height:1.55;min-height:56px}
.hint{font-size:12px;opacity:.55;margin-top:10px}
.dots{display:flex;gap:6px;margin-top:12px}.dot{height:5px;flex:1;border-radius:99px;background:rgba(255,255,255,.17)}.dot.on{background:rgba(220,238,215,.8)}
</style>
</head>
<body>
<main class="hero" id="hero">
<div class="shade"></div>
<div class="top"><div class="name">がのーさ</div><div class="time" id="clock"></div></div>
<div class="greeting" id="greeting"></div>
<section class="panel">
<div class="period" id="period"></div>
<div class="line" id="line"></div>
<div class="hint">がのーさをタップすると、別のひとこと</div>
<div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</section>
</main>
<script>
const sets={
 morning:{label:'MORNING',img:'ganousa_morning.png',greet:'おはよう ☀️',lines:['おはよ。ちゃんと起きられた？','んー……あと5分だけ、一緒にのんびりしよ？','今日も一緒に、がんばろうね。']},
 day:{label:'DAYTIME',img:'ganousa_daytime.png',greet:'こんにちは ☀️',lines:['今日は何してるの？','ちょっと休憩しない？ 私も付き合うよ。','見に来てくれたんだ。……ふふ、ありがと。']},
 evening:{label:'EVENING',img:'ganousa_evening.png',greet:'おかえり 🌇',lines:['おかえり。今日もお疲れさま。','夕方って、なんだか落ち着くね。','今日のこと、少しだけ聞かせて？']},
 night:{label:'NIGHT',img:'ganousa_night.png',greet:'おやすみ 🌙',lines:['もう遅いよ。そろそろ眠ろう？','今日も一日お疲れさま。','おやすみ。また明日ね……。']}
};
let current,index=0;
function state(){const h=new Date().getHours();return h>=5&&h<11?'morning':h>=11&&h<17?'day':h>=17&&h<22?'evening':'night'}
function showGreeting(s){const g=document.getElementById('greeting');g.textContent=sets[s].greet;g.classList.remove('show');void g.offsetWidth;g.classList.add('show')}
function render(force=false){const s=state();if(s!==current||force){current=s;index=0;const x=sets[s];document.getElementById('hero').style.backgroundImage="url('"+x.img+"')";document.getElementById('period').textContent=x.label;document.getElementById('line').textContent=x.lines[0];document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===['morning','day','evening','night'].indexOf(s)));showGreeting(s)}}
function clock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});render()}
document.getElementById('hero').addEventListener('click',()=>{const a=sets[current].lines;index=(index+1)%a.length;document.getElementById('line').textContent=a[index]});
clock();setInterval(clock,1000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
